<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Puestos</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Estilos base para arrastrar y soltar */
        [draggable="true"] {
            cursor: grab;
        }
        [draggable="true"]:active {
            cursor: grabbing;
        }
        /* Ocultar barra de desplazamiento manteniendo funcionalidad */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Scrollbar personalizada y sutil para listas horizontales */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #fcd34d; /* amber-300 */
            border-radius: 20px;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col relative overflow-hidden">
    
    <!-- Contenedor Principal de la App -->
    <div id="app" class="h-screen flex flex-col w-full"></div>

    <script type="module">
        // --- ESTADO GLOBAL DE LA APLICACIÓN ---
        const App = {
            state: {
                // --- APP ---
                activeTab: 'lista',
                cols: 8, 
                colAisles: [], 
                rowAisles: [], 
                aisleFrequency: 2,
                maxAisles: 1,
                groupFormat: 'individual',
                editMode: false,
                hiddenDesks: {}, 
                students: [],
                newStudentName: '',
                importMessage: { text: '', type: '' },
                isImporting: false,
                isExporting: false,
                assignments: {},
                benchedStudents: new Set(),
                courseName: '',
                classDate: new Date().toISOString().split('T')[0],
                searchTerm: '',
                restrictionSearchTerm: '',
                restrictingStudent: null,
                limitStudent: null,
                confirmDeleteAll: false,
                editNameStudent: null,
                notification: null,
                showGuide: false
            },

            // --- INICIALIZACIÓN ---
            init() {
                this.render();
            },

            // --- LÓGICA DE ASIGNACIÓN AUTOMÁTICA ---
            runAutoAssignment() {
                const s = this.state;
                if (s.students.length === 0) {
                    if (Object.keys(s.assignments).length > 0) {
                        s.assignments = {};
                    }
                    return;
                }

                const newAssignments = {};
                const assignedIds = new Set();
                
                Object.entries(s.assignments).forEach(([seatId, studentId]) => {
                    const [ar, ac] = seatId.split('-').map(Number);
                    const studentExists = s.students.find(st => st.id === studentId);
                    
                    if (studentExists && !s.hiddenDesks[seatId] && 
                        !(s.colAisles && s.colAisles.includes(ac)) && 
                        !(s.rowAisles && s.rowAisles.includes(ar))) {
                        newAssignments[seatId] = studentId;
                        assignedIds.add(studentId);
                    }
                });

                const unassignedOnes = s.students.filter(st => !assignedIds.has(st.id) && !s.benchedStudents.has(st.id));
                const totalGridCols = s.cols + (s.colAisles ? s.colAisles.length : 0);
                
                if (unassignedOnes.length > 0 || Object.keys(newAssignments).length !== (s.students.length - s.benchedStudents.size)) {
                    let studentIdx = 0;
                    let r = 0;
                    let seatsFound = 0;
                    const targetSeats = s.students.length - s.benchedStudents.size;

                    while (seatsFound < targetSeats) {
                        if (s.rowAisles && s.rowAisles.includes(r)) {
                            r++;
                            continue; 
                        }

                        for (let c = 0; c < totalGridCols; c++) {
                            if (s.colAisles && s.colAisles.includes(c)) continue;

                            const seatId = `${r}-${c}`;
                            if (!s.hiddenDesks[seatId]) {
                                if (!newAssignments[seatId] && studentIdx < unassignedOnes.length) {
                                    newAssignments[seatId] = unassignedOnes[studentIdx].id;
                                    studentIdx++;
                                }
                                seatsFound++;
                            }
                            if (seatsFound >= targetSeats) break;
                        }
                        r++;
                    }
                    s.assignments = newAssignments;
                }
            },

            // --- CALCULOS COMPUTADOS ---
            getNeighbors(seatId) {
                const [r, c] = seatId.split('-').map(Number);
                const neighbors = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        neighbors.push(`${r + dr}-${c + dc}`);
                    }
                }
                return neighbors;
            },

            getVisualGridMap() {
                const map = {};
                let vRow = 0;
                const totalGridCols = this.state.cols + (this.state.colAisles ? this.state.colAisles.length : 0);
                
                for (let r = 0; r < 50; r++) { 
                    if (this.state.rowAisles && this.state.rowAisles.includes(r)) continue;
                    let vCol = 0;
                    for (let c = 0; c < totalGridCols; c++) {
                        if (this.state.colAisles && this.state.colAisles.includes(c)) continue;
                        map[`${r}-${c}`] = { vRow, vCol };
                        vCol++;
                    }
                    vRow++;
                }
                return map;
            },

            getGroupMates(seatId, visualMap) {
                const mates = [];
                const pos = visualMap[seatId];
                if (!pos) return mates;

                const format = this.state.groupFormat || 'individual';
                if (format === 'individual') return mates;

                Object.entries(visualMap).forEach(([otherSeatId, otherPos]) => {
                    if (otherSeatId === seatId) return;
                    
                    if (format === 'pairs') {
                        if (otherPos.vRow === pos.vRow && Math.floor(otherPos.vCol / 2) === Math.floor(pos.vCol / 2)) {
                            mates.push(otherSeatId);
                        }
                    } else if (format === 'trios') {
                        if (otherPos.vRow === pos.vRow && Math.floor(otherPos.vCol / 3) === Math.floor(pos.vCol / 3)) {
                            mates.push(otherSeatId);
                        }
                    } else if (format === 'quads') {
                        if (Math.floor(otherPos.vRow / 2) === Math.floor(pos.vRow / 2) && 
                            Math.floor(otherPos.vCol / 2) === Math.floor(pos.vCol / 2)) {
                            mates.push(otherSeatId);
                        }
                    }
                });
                return mates;
            },

            getConflicts() {
                const conflictList = new Set();
                const visualMap = this.getVisualGridMap();

                Object.entries(this.state.assignments).forEach(([seatId, studentId]) => {
                    const student = this.state.students.find(s => s.id === studentId);
                    if (!student || !student.restrictions) return;

                    let restrictions = student.restrictions;
                    if (Array.isArray(restrictions)) {
                        restrictions = Object.fromEntries(restrictions.map(id => [id, 'all']));
                    }

                    const neighbors = this.getNeighbors(seatId);
                    neighbors.forEach(nId => {
                        const neighborStudentId = this.state.assignments[nId];
                        if (neighborStudentId && restrictions[neighborStudentId] === 'all') {
                            conflictList.add(seatId);
                            conflictList.add(nId);
                        }
                    });

                    const mates = this.getGroupMates(seatId, visualMap);
                    mates.forEach(mId => {
                        const mateStudentId = this.state.assignments[mId];
                        if (mateStudentId && (restrictions[mateStudentId] === 'same' || restrictions[mateStudentId] === 'all')) {
                            conflictList.add(seatId);
                            conflictList.add(mId);
                        }
                    });
                });
                return conflictList;
            },

            getRowWarnings() {
                const warningList = new Set();
                Object.entries(this.state.assignments).forEach(([seatId, studentId]) => {
                    const student = this.state.students.find(s => s.id === studentId);
                    if (!student || !student.maxRow) return;

                    const rowIdx = parseInt(seatId.split('-')[0]);
                    
                    let visualRow = 1;
                    for(let i = 0; i < rowIdx; i++) {
                        if (!this.state.rowAisles || !this.state.rowAisles.includes(i)) {
                            visualRow++;
                        }
                    }

                    if (visualRow > student.maxRow) {
                        warningList.add(seatId);
                    }
                });
                return warningList;
            },

            getCalculatedRows() {
                if (this.state.students.length === 0) return 1;
                const totalGridCols = this.state.cols + (this.state.colAisles ? this.state.colAisles.length : 0);
                let count = 0, r = 0;
                while (count < this.state.students.length) {
                    if (this.state.rowAisles && this.state.rowAisles.includes(r)) {
                        r++;
                        continue;
                    }
                    for (let c = 0; c < totalGridCols; c++) {
                        if (this.state.colAisles && this.state.colAisles.includes(c)) continue;

                        if (!this.state.hiddenDesks[`${r}-${c}`]) count++;
                        if (count >= this.state.students.length) break;
                    }
                    if (count >= this.state.students.length) break;
                    r++;
                }
                return r + 1;
            },

            // --- EXPORTAR / IMPORTAR PROYECTO (.JSON) ---
            async handleExportProject() {
                const exportData = {
                    cols: this.state.cols,
                    colAisles: this.state.colAisles,
                    rowAisles: this.state.rowAisles,
                    aisleFrequency: this.state.aisleFrequency,
                    maxAisles: this.state.maxAisles,
                    groupFormat: this.state.groupFormat,
                    hiddenDesks: this.state.hiddenDesks,
                    students: this.state.students,
                    assignments: this.state.assignments,
                    benchedStudents: Array.from(this.state.benchedStudents),
                    courseName: this.state.courseName,
                    classDate: this.state.classDate
                };
                
                const jsonString = JSON.stringify(exportData, null, 2);
                const defaultFileName = `Salagrama_${this.state.courseName ? this.state.courseName.replace(/[^a-z0-9]/gi, '_') : 'Guardado'}_${this.state.classDate || new Date().toLocaleDateString()}.json`;

                let savedModernly = false;

                try {
                    // Intenta usar la API moderna File System Access si está disponible y no está bloqueada por el entorno (ej. iframe)
                    if (window.showSaveFilePicker) {
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: defaultFileName,
                            types: [{
                                description: 'Archivo de Proyecto Salagrama',
                                accept: { 'application/json': ['.json'] },
                            }],
                        });
                        const writable = await fileHandle.createWritable();
                        await writable.write(jsonString);
                        await writable.close();
                        this.showNotification("Proyecto guardado correctamente");
                        savedModernly = true;
                    }
                } catch (err) {
                    // Si el usuario simplemente canceló la ventana modal, no hacemos fallback
                    if (err.name === 'AbortError') {
                        return;
                    }
                    // Cualquier otro error (como SecurityError en iframes) se loguea y pasa al fallback
                    console.warn("No se pudo usar la API de guardado moderna (posiblemente por restricciones del navegador). Usando método tradicional...", err);
                }

                // Fallback automático para iframes (como Canvas) o navegadores sin soporte
                if (!savedModernly) {
                    try {
                        const blob = new Blob([jsonString], { type: "application/json" });
                        const url = URL.createObjectURL(blob);
                        
                        const downloadAnchorNode = document.createElement('a');
                        downloadAnchorNode.setAttribute("href", url);
                        downloadAnchorNode.setAttribute("download", defaultFileName);
                        document.body.appendChild(downloadAnchorNode);
                        downloadAnchorNode.click();
                        
                        setTimeout(() => {
                            document.body.removeChild(downloadAnchorNode);
                            URL.revokeObjectURL(url);
                        }, 100);
                        
                        this.showNotification("Proyecto descargado en tu carpeta por defecto");
                    } catch (fallbackErr) {
                        console.error("Error crítico al guardar el proyecto:", fallbackErr);
                        this.showNotification("Error al guardar el archivo", true);
                    }
                }
            },

            handleImportProject(input) {
                const file = input.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (data.benchedStudents) {
                            data.benchedStudents = new Set(data.benchedStudents);
                        } else {
                            data.benchedStudents = new Set();
                        }

                        if (data.students) {
                            data.students = data.students.map(s => {
                                let newR = {};
                                if (Array.isArray(s.restrictions)) {
                                    s.restrictions.forEach(id => newR[id] = 'all');
                                } else if (s.restrictions) {
                                    newR = s.restrictions;
                                }
                                return { ...s, restrictions: newR };
                            });
                        }
                        
                        this.updateState({
                            ...data,
                            activeTab: this.state.activeTab,
                            editMode: this.state.editMode,
                            confirmDeleteAll: false,
                            restrictingStudent: null,
                            limitStudent: null,
                            editNameStudent: null
                        });
                        
                        input.value = '';
                        this.showNotification("Proyecto cargado correctamente");
                        
                    } catch (error) {
                        console.error("Error al leer el archivo del proyecto:", error);
                        this.showNotification("Error: Archivo no válido", true);
                    }
                };
                reader.readAsText(file);
            },

            showNotification(msg, isError = false) {
                this.updateState({ notification: { text: msg, error: isError } });
                setTimeout(() => {
                    if (this.state.notification?.text === msg) {
                        this.updateState({ notification: null });
                    }
                }, 4000);
            },

            // --- ACCIONES ---
            updateState(newState) {
                this.state = { ...this.state, ...newState };
                this.render();
            },

            setTab(tab) { this.updateState({ activeTab: tab }); },
            setCols(val) { 
                const newCols = Number(val) || 1; 
                let validAisles = [];
                let sortedAisles = [...(this.state.colAisles || [])].sort((a,b)=>a-b);
                
                for (let i = 0; i < sortedAisles.length; i++) {
                    const gridIndex = sortedAisles[i];
                    const desksBefore = gridIndex - i; 
                    if (desksBefore < newCols) {
                        validAisles.push(gridIndex);
                    }
                }
                this.updateState({ cols: newCols, colAisles: validAisles }); 
            },
            setAisleFreq(val) { this.updateState({ aisleFrequency: Number(val) || 1 }); },
            setMaxAisles(val) { this.updateState({ maxAisles: Number(val) || 0 }); },
            setGroupFormat(val) { this.updateState({ groupFormat: val }); },
            toggleEditMode() { this.updateState({ editMode: !this.state.editMode }); },
            setCourseName(val) { this.updateState({ courseName: val }); },
            setClassDate(val) { this.updateState({ classDate: val }); },
            setSearchTerm(val) { this.updateState({ searchTerm: val }); },
            setRestrictionSearchTerm(val) { this.updateState({ restrictionSearchTerm: val }); },

            applyAutoAisles() {
                const newAisles = [];
                let placed = 0;
                let absoluteCol = 0;

                for (let desk = 1; desk <= this.state.cols; desk++) {
                    absoluteCol++; 
                    if (this.state.aisleFrequency > 0 && 
                        desk % this.state.aisleFrequency === 0 && 
                        desk < this.state.cols && 
                        placed < this.state.maxAisles) {
                        
                        newAisles.push(absoluteCol); 
                        absoluteCol++;
                        placed++;
                    }
                }
                this.updateState({ colAisles: newAisles });
            },

            toggleColAisle(gridIndex) {
                if (!this.state.editMode) return;
                let newAisles = [...(this.state.colAisles || [])];
                let newAssignments = { ...this.state.assignments };
                let newHiddenDesks = { ...this.state.hiddenDesks };
                
                if (newAisles.includes(gridIndex)) {
                    newAisles = newAisles.filter(c => c !== gridIndex);
                    newAisles = newAisles.map(c => c > gridIndex ? c - 1 : c);
                    
                    const updatedAssignments = {};
                    Object.entries(newAssignments).forEach(([seatId, studentId]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (c > gridIndex) updatedAssignments[`${r}-${c - 1}`] = studentId;
                        else if (c < gridIndex) updatedAssignments[seatId] = studentId;
                    });
                    newAssignments = updatedAssignments;

                    const updatedHidden = {};
                    Object.entries(newHiddenDesks).forEach(([seatId, val]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (c > gridIndex) updatedHidden[`${r}-${c - 1}`] = val;
                        else if (c < gridIndex) updatedHidden[seatId] = val;
                    });
                    newHiddenDesks = updatedHidden;
                } else {
                    newAisles = newAisles.map(c => c >= gridIndex ? c + 1 : c);
                    newAisles.push(gridIndex);
                    
                    const updatedAssignments = {};
                    Object.entries(newAssignments).forEach(([seatId, studentId]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (c >= gridIndex) updatedAssignments[`${r}-${c + 1}`] = studentId;
                        else updatedAssignments[seatId] = studentId;
                    });
                    newAssignments = updatedAssignments;

                    const updatedHidden = {};
                    Object.entries(newHiddenDesks).forEach(([seatId, val]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (c >= gridIndex) updatedHidden[`${r}-${c + 1}`] = val;
                        else updatedHidden[seatId] = val;
                    });
                    newHiddenDesks = updatedHidden;
                }
                this.updateState({ colAisles: newAisles, assignments: newAssignments, hiddenDesks: newHiddenDesks });
            },

            toggleRowAisle(gridIndex) {
                if (!this.state.editMode) return;
                let newAisles = [...(this.state.rowAisles || [])];
                let newAssignments = { ...this.state.assignments };
                let newHiddenDesks = { ...this.state.hiddenDesks };

                if (newAisles.includes(gridIndex)) {
                    newAisles = newAisles.filter(r => r !== gridIndex);
                    newAisles = newAisles.map(r => r > gridIndex ? r - 1 : r);

                    const updatedAssignments = {};
                    Object.entries(newAssignments).forEach(([seatId, studentId]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (r > gridIndex) updatedAssignments[`${r - 1}-${c}`] = studentId;
                        else if (r < gridIndex) updatedAssignments[seatId] = studentId;
                    });
                    newAssignments = updatedAssignments;

                    const updatedHidden = {};
                    Object.entries(newHiddenDesks).forEach(([seatId, val]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (r > gridIndex) updatedHidden[`${r - 1}-${c}`] = val;
                        else if (r < gridIndex) updatedHidden[seatId] = val;
                    });
                    newHiddenDesks = updatedHidden;

                } else {
                    newAisles = newAisles.map(r => r >= gridIndex ? r + 1 : r);
                    newAisles.push(gridIndex);

                    const updatedAssignments = {};
                    Object.entries(newAssignments).forEach(([seatId, studentId]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (r >= gridIndex) updatedAssignments[`${r + 1}-${c}`] = studentId;
                        else updatedAssignments[seatId] = studentId;
                    });
                    newAssignments = updatedAssignments;

                    const updatedHidden = {};
                    Object.entries(newHiddenDesks).forEach(([seatId, val]) => {
                        const [r, c] = seatId.split('-').map(Number);
                        if (r >= gridIndex) updatedHidden[`${r + 1}-${c}`] = val;
                        else updatedHidden[seatId] = val;
                    });
                    newHiddenDesks = updatedHidden;
                }
                
                this.updateState({ rowAisles: newAisles, assignments: newAssignments, hiddenDesks: newHiddenDesks });
            },

            toggleDeskVisibility(seatId) {
                if (!this.state.editMode) return;
                const newHidden = { ...this.state.hiddenDesks };
                if (newHidden[seatId]) delete newHidden[seatId];
                else newHidden[seatId] = true;
                this.updateState({ hiddenDesks: newHidden });
            },

            hideEmptyDesks() {
                const newHidden = { ...this.state.hiddenDesks };
                const totalGridCols = this.state.cols + (this.state.colAisles ? this.state.colAisles.length : 0);
                
                let maxAssignedRow = 0;
                Object.keys(this.state.assignments).forEach(sId => {
                    const r = parseInt(sId.split('-')[0]);
                    if (r > maxAssignedRow) maxAssignedRow = r;
                });

                const rowsToScan = Math.max(maxAssignedRow, this.getCalculatedRows()) + 2;

                for (let r = 0; r < rowsToScan; r++) {
                    if (this.state.rowAisles && this.state.rowAisles.includes(r)) continue;
                    for (let c = 0; c < totalGridCols; c++) {
                        if (this.state.colAisles && this.state.colAisles.includes(c)) continue;
                        const sId = `${r}-${c}`;
                        
                        if (!this.state.assignments[sId]) {
                            newHidden[sId] = true;
                        }
                    }
                }
                
                this.updateState({ hiddenDesks: newHidden });
                this.showNotification("Puestos vacíos ocultados");
            },

            showAllDesks() {
                this.updateState({ hiddenDesks: {} });
                this.showNotification("Todos los puestos restaurados");
            },

            handleAddStudent(e) {
                e.preventDefault();
                const nameInput = document.getElementById('newStudentName').value;
                if (!nameInput.trim()) return;
                const newS = { id: Date.now().toString(), name: nameInput.trim(), restrictions: {}, maxRow: null };
                this.updateState({ 
                    students: [...this.state.students, newS],
                    newStudentName: '' 
                });
            },

            handleRemoveStudent(studentId) {
                const newBenched = new Set(this.state.benchedStudents);
                newBenched.delete(studentId);
                
                const newAssignments = { ...this.state.assignments };
                Object.keys(newAssignments).forEach(seatId => {
                    if (newAssignments[seatId] === studentId) delete newAssignments[seatId];
                });

                this.updateState({
                    students: this.state.students.filter(s => s.id !== studentId),
                    benchedStudents: newBenched,
                    assignments: newAssignments
                });
            },

            handleDeleteAll() {
                this.updateState({ confirmDeleteAll: true });
            },

            cancelDeleteAll() {
                this.updateState({ confirmDeleteAll: false });
            },

            confirmDeleteAllStudents() {
                this.updateState({
                    students: [],
                    assignments: {},
                    benchedStudents: new Set(),
                    confirmDeleteAll: false
                });
            },

            openEditNameModal(studentId) {
                const student = this.state.students.find(s => s.id === studentId);
                this.updateState({ editNameStudent: { ...student } });
                setTimeout(() => {
                    const input = document.getElementById('editStudentNameInput');
                    if (input) {
                        input.focus();
                        input.select();
                    }
                }, 10);
            },

            closeEditNameModal() {
                this.updateState({ editNameStudent: null });
            },

            saveStudentName(e) {
                e.preventDefault();
                const newName = document.getElementById('editStudentNameInput').value.trim();
                if (!newName) return;

                const studentId = this.state.editNameStudent.id;
                const updatedStudents = this.state.students.map(s =>
                    s.id === studentId ? { ...s, name: newName } : s
                );

                this.updateState({
                    students: updatedStudents,
                    editNameStudent: null
                });
            },

            openRestrictionModal(studentId) {
                const student = this.state.students.find(s => s.id === studentId);
                this.updateState({ restrictingStudent: student, restrictionSearchTerm: '' });
            },

            closeRestrictionModal() {
                this.updateState({ restrictingStudent: null });
            },

            setRestriction(targetId, type) {
                const sourceId = this.state.restrictingStudent.id;
                const newStudents = this.state.students.map(s => {
                    if (s.id === sourceId) {
                        let newR = Array.isArray(s.restrictions) ? 
                            Object.fromEntries(s.restrictions.map(id => [id, 'all'])) : 
                            { ...(s.restrictions || {}) };
                        
                        if (type === null) delete newR[targetId];
                        else newR[targetId] = type;
                        
                        return { ...s, restrictions: newR };
                    }
                    if (s.id === targetId) {
                        let newR = Array.isArray(s.restrictions) ? 
                            Object.fromEntries(s.restrictions.map(id => [id, 'all'])) : 
                            { ...(s.restrictions || {}) };
                        
                        if (type === null) delete newR[sourceId];
                        else newR[sourceId] = type;
                        
                        return { ...s, restrictions: newR };
                    }
                    return s;
                });
                
                this.updateState({

            openLimitModal(studentId) {

            // --- DRAG AND DROP ---
            handleDragStart(e, studentId, sourceSeatId) {
                e.dataTransfer.setData('studentId', studentId);
                e.dataTransfer.setData('sourceSeatId', sourceSeatId || '');
            },

            handleDropOnSeat(e, targetSeatId) {
                e.preventDefault();
                const tr = Number(targetSeatId.split('-')[0]);
                const tc = Number(targetSeatId.split('-')[1]);
                
                if (this.state.hiddenDesks[targetSeatId] || 
                    (this.state.colAisles && this.state.colAisles.includes(tc)) || 
                    (this.state.rowAisles && this.state.rowAisles.includes(tr))) return;
                
                const studentId = e.dataTransfer.getData('studentId');
                const sourceSeatId = e.dataTransfer.getData('sourceSeatId');
                if (sourceSeatId === targetSeatId) return;

                const newAssignments = { ...this.state.assignments };
                const targetStudentId = newAssignments[targetSeatId];
                
                // No permitir soltar sobre un estudiante bloqueado
                if (targetStudentId) {
                    const targetStudent = this.state.students.find(s => s.id === targetStudentId);
                    if (targetStudent && targetStudent.isLocked) return;
                }
                
                newAssignments[targetSeatId] = studentId;
                const newBenched = new Set(this.state.benchedStudents);
                
                if (sourceSeatId) {
                    if (targetStudentId) newAssignments[sourceSeatId] = targetStudentId;
                    else delete newAssignments[sourceSeatId];
                } else {
                    newBenched.delete(studentId);
                    if (targetStudentId) newBenched.add(targetStudentId);
                }
                
                this.updateState({ assignments: newAssignments, benchedStudents: newBenched });
            },

            handleUnassignStudent(e, seatId, studentId) {
                e.stopPropagation();
                const newBenched = new Set(this.state.benchedStudents);
                newBenched.add(studentId);
                
                const newAssignments = { ...this.state.assignments };
                delete newAssignments[seatId];
                
                const newStudents = this.state.students.map(s => 
                    s.id === studentId ? { ...s, isLocked: false } : s
                );
                
                this.updateState({ benchedStudents: newBenched, assignments: newAssignments, students: newStudents });
            },

            toggleLockStudent(e, studentId) {
                e.stopPropagation();
                const newStudents = this.state.students.map(s => 
                    s.id === studentId ? { ...s, isLocked: !s.isLocked } : s
                );
                this.updateState({ students: newStudents });
            },

            handleRandomize() {
                this.state.benchedStudents = new Set();
                const totalGridCols = this.state.cols + (this.state.colAisles ? this.state.colAisles.length : 0);
                const rows = this.getCalculatedRows();
                const visualMap = this.getVisualGridMap();

                // Identificar a los estudiantes bloqueados y guardarlos
                const lockedAssignments = {};
                const lockedStudentIds = new Set();
                const lockedSeats = new Set();

                Object.entries(this.state.assignments).forEach(([seatId, studentId]) => {
                    const student = this.state.students.find(s => s.id === studentId);
                    if (student && student.isLocked && !this.state.hiddenDesks[seatId]) {
                        lockedAssignments[seatId] = studentId;
                        lockedStudentIds.add(studentId);
                        lockedSeats.add(seatId);
                    }
                });

                const availableSeats = [];
                for (let r = 0; r < rows; r++) {
                    if (this.state.rowAisles && this.state.rowAisles.includes(r)) continue;
                    for (let c = 0; c < totalGridCols; c++) {
                        if (this.state.colAisles && this.state.colAisles.includes(c)) continue;
                        if (!this.state.hiddenDesks[`${r}-${c}`] && !lockedSeats.has(`${r}-${c}`)) {
                            availableSeats.push(`${r}-${c}`);
                        }
                    }
                }
                
                const studentsToPlace = this.state.students.filter(s => !lockedStudentIds.has(s.id));
                const seatsToFill = availableSeats.slice(0, studentsToPlace.length);
                
                let bestAssignment = null;
                let minScore = Infinity;

                for (let attempt = 0; attempt < 500; attempt++) {
                    const currentAssign = { ...lockedAssignments };
                    const shuffledSeats = [...seatsToFill].sort(() => Math.random() - 0.5);
                    const shuffledStudents = [...studentsToPlace].sort(() => Math.random() - 0.5);
                    
                    shuffledStudents.forEach((s, i) => { 
                        if (shuffledSeats[i]) currentAssign[shuffledSeats[i]] = s.id; 
                    });

                    let currentPenalty = 0;
                    Object.entries(currentAssign).forEach(([seatId, sId]) => {
                        const student = this.state.students.find(st => st.id === sId);
                        if (!student) return;

                        let restrictions = student.restrictions || {};
                        if (Array.isArray(restrictions)) {
                            restrictions = Object.fromEntries(restrictions.map(id => [id, 'all']));
                        }

                        this.getNeighbors(seatId).forEach(nId => {
                            const neighborStudentId = currentAssign[nId];
                            if (neighborStudentId && restrictions[neighborStudentId] === 'all') {
                                currentPenalty += 100;
                            }
                        });

                        this.getGroupMates(seatId, visualMap).forEach(mId => {
                            const mateStudentId = currentAssign[mId];
                            if (mateStudentId && (restrictions[mateStudentId] === 'same' || restrictions[mateStudentId] === 'all')) {
                                currentPenalty += 100;
                            }
                        });

                        if (student.maxRow) {
                            const rowIdx = parseInt(seatId.split('-')[0]);
                            let visualRow = 1;
                            for(let i=0; i<rowIdx; i++) {
                                if (!this.state.rowAisles || !this.state.rowAisles.includes(i)) visualRow++;
                            }
                            if (visualRow > student.maxRow) currentPenalty += 50;
                        }
                    });

                    if (currentPenalty === 0) {
                        bestAssignment = currentAssign;
                        break;
                    }
                    if (currentPenalty < minScore) {
                        minScore = currentPenalty;
                        bestAssignment = currentAssign;
                    }
                }
                this.updateState({ assignments: bestAssignment || lockedAssignments });
            },

            async handleFileUpload(input) {
                const file = input.files[0];
                if (!file) return;
                this.updateState({ isImporting: true });
                
                try {
                    let XLSX = window.XLSX;
                    if (!XLSX) {
                        await new Promise((res, rej) => {
                            const s = document.createElement('script');
                            s.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
                            s.onload = res; s.onerror = rej; document.head.appendChild(s);
                        });
                        XLSX = window.XLSX;
                    }
                    
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const wb = XLSX.read(data, { type: 'array' });
                            const ws = wb.Sheets[wb.SheetNames[0]];
                            
                            // Extraer los datos en forma de matriz cruda
                            const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                            
                            // Filtrar filas completamente vacías
                            const rows = json.filter(row => row.some(cell => String(cell).trim() !== ''));
                            if (rows.length === 0) throw new Error("Archivo vacío");

                            // Estrategia de búsqueda de cabeceras
                            let headerRowIndex = 0;
                            let headers = rows[0].map(h => String(h).trim().toUpperCase());
                            
                            // Si la primera fila no tiene nada reconocible, revisar la segunda (por si hay un título encima)
                            if (!headers.some(h => h.includes('NOMBRE') || h.includes('APELLIDO') || h.includes('ALUMNO') || h.includes('ESTUDIANTE'))) {
                                if (rows.length > 1) {
                                    const h2 = rows[1].map(h => String(h).trim().toUpperCase());
                                    if (h2.some(h => h.includes('NOMBRE') || h.includes('APELLIDO') || h.includes('ALUMNO') || h.includes('ESTUDIANTE'))) {
                                        headers = h2;
                                        headerRowIndex = 1;
                                    }
                                }
                            }

                            // Detectar índices automáticamente
                            let nIdx = headers.findIndex(h => h === 'NOMBRE' || h === 'NOMBRES');
                            let aIdx = headers.findIndex(h => h.includes('APELLIDO PATERNO') || h === 'APELLIDO' || h === 'APELLIDOS');
                            let fullNameIdx = headers.findIndex(h => h === 'ESTUDIANTE' || h === 'ALUMNO' || h.includes('NOMBRE COMPLETO'));

                            // Si no hay cabeceras reconocibles, deducir la columna principal adivinando qué columna tiene texto válido
                            if (nIdx === -1 && fullNameIdx === -1 && aIdx === -1) {
                                const dataRow = rows[headerRowIndex + 1] || rows[headerRowIndex];
                                for (let c = 0; c < dataRow.length; c++) {
                                    const cellVal = String(dataRow[c]).trim();
                                    // Asume que la columna con cadenas de texto > 4 caracteres es el nombre
                                    if (cellVal.length > 4 && isNaN(cellVal)) {
                                        fullNameIdx = c;
                                        break;
                                    }
                                }
                                // Si adivinó la columna, no ignorar la primera fila
                                if (fullNameIdx !== -1) headerRowIndex = -1; 
                            }

                            const newS = [];
                            
                            for (let i = headerRowIndex + 1; i < rows.length; i++) {
                                const row = rows[i];
                                let finalName = '';

                                // CASO A: Columnas separadas (Nombres / Apellidos)
                                if (nIdx !== -1 && aIdx !== -1 && row[nIdx] && row[aIdx]) {
                                    const namePart = String(row[nIdx]).trim().split(' ')[0]; 
                                    const lastNamePart = String(row[aIdx]).trim().split(' ')[0]; 
                                    finalName = `${namePart} ${lastNamePart}`;
                                } 
                                // CASO B: Encontramos solo columna de nombres (sin apellidos formales)
                                else if (nIdx !== -1 && row[nIdx] && aIdx === -1) {
                                    finalName = String(row[nIdx]);
                                }
                                // CASO C: Encontramos la columna universal (Ej. "Estudiante" o adivinada)
                                else if (fullNameIdx !== -1 && row[fullNameIdx]) {
                                    finalName = String(row[fullNameIdx]);
                                }

                                // PROCESAMIENTO INTELIGENTE DEL NOMBRE
                                if (finalName) {
                                    let s = finalName.trim();
                                    
                                    // Ignorar filas basura/errores de Excel
                                    if (!s || s.toUpperCase().includes('NOMBRE') || s.toUpperCase().includes('ALUMNO') || s.includes('#VALUE!')) continue;

                                    if (s.includes(',')) {
                                        // Viene como "Apellidos, Nombres" -> lo damos vuelta y acortamos
                                        const parts = s.split(',');
                                        const apellidos = parts[0].trim().split(' ')[0];
                                        const nombres = parts[1].trim().split(' ')[0];
                                        finalName = `${nombres} ${apellidos}`;
                                    } else {
                                        // Viene sin comas. Simplificamos a un máximo de dos palabras para la visual.
                                        const words = s.split(/\s+/).filter(w => w.length > 1);
                                        if (words.length === 1) finalName = words[0];
                                        else if (words.length === 2) finalName = `${words[0]} ${words[1]}`;
                                        else if (words.length === 3) finalName = `${words[0]} ${words[1]}`; // Asume Juan Perez Soto -> Juan Perez
                                        else if (words.length >= 4) finalName = `${words[0]} ${words[2]}`; // Asume Juan Pablo Perez Soto -> Juan Perez
                                        else finalName = s;
                                    }

                                    // Capitalización correcta (MAYÚSCULAS -> Nombre Propio)
                                    finalName = finalName.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
                                    
                                    newS.push({ id: Math.random().toString(36).substr(2, 9), name: finalName, restrictions: {}, maxRow: null });
                                }
                            }

                            if (newS.length === 0) {
                                this.updateState({ importMessage: { text: 'No se detectaron nombres', type: 'error' }, isImporting: false });
                                setTimeout(() => { this.updateState({ importMessage: { text: '', type: '' } }); }, 4000);
                                return;
                            }

                            this.updateState({ 
                                students: [...this.state.students, ...newS],
                                importMessage: { text: `¡${newS.length} estudiantes detectados!`, type: 'success' },
                                isImporting: false
                            });
                        } catch (e) { 
                            console.error(e);
                            this.updateState({ importMessage: { text: 'Error procesando archivo', type: 'error' }, isImporting: false }); 
                        }
                        
                        setTimeout(() => {
                            this.state.importMessage = { text: '', type: '' };
                            this.render();
                        }, 4000);
                    };
                    reader.readAsArrayBuffer(file);
                } catch (err) { 
                    this.updateState({ isImporting: false }); 
                }
            },

            async handleDownloadPDF() {
                this.updateState({ isExporting: true });
                await new Promise(resolve => setTimeout(resolve, 100));

                const element = document.getElementById('salagrama-map');
                if (!element) {
                    this.updateState({ isExporting: false });
                    return;
                }

                try {
                    if (!window.html2canvas) {
                        await new Promise((resolve) => {
                            const script = document.createElement('script');
                            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                            script.onload = resolve;
                            document.head.appendChild(script);
                        });
                    }
                    if (!window.jspdf) {
                        await new Promise((resolve) => {
                            const script = document.createElement('script');
                            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                            script.onload = resolve;
                            document.head.appendChild(script);
                        });
                    }

                    const { jsPDF } = window.jspdf;
                    
                    const canvas = await window.html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#f8fafc',
                        windowWidth: element.scrollWidth,
                        windowHeight: element.scrollHeight
                    });

                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

                    const imgProps = pdf.getImageProperties(imgData);
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                    
                    const fileName = `Salagrama_${this.state.courseName ? this.state.courseName.replace(/[^a-z0-9]/gi, '_') : 'Clase'}_${this.state.classDate || new Date().toLocaleDateString()}.pdf`;
                    pdf.save(fileName);

                } catch (error) {
                    console.error('Error generando PDF:', error);
                } finally {
                    this.updateState({ isExporting: false });
                }
            },

                if (this.state.editNameStudent) {
                    html += `

                return html;

            renderSalagrama() {
                const conflicts = this.getConflicts();
                const warnings = this.getRowWarnings();
                const benchedList = this.state.students.filter(s => this.state.benchedStudents.has(s.id) || !Object.values(this.state.assignments).includes(s.id));
                
                // La suma de mesas y pasillos conforma el tamaño total de la cuadricula real
                const totalGridCols = this.state.cols + (this.state.colAisles ? this.state.colAisles.length : 0);
                
                let gridHtml = '';
                
                // Generar Controles Superiores de Columnas para Modo Edición
                if (this.state.editMode) {
                    gridHtml += `<div class="flex items-center justify-center pr-2 font-bold text-slate-300 text-[10px]"><i data-lucide="settings-2" class="w-4 h-4"></i></div>`;
                    for (let c = 0; c < totalGridCols; c++) {
                        const isColAisle = this.state.colAisles && this.state.colAisles.includes(c);
                        gridHtml += `
                            <div class="flex items-center justify-center mb-2 w-full">
                                <button onclick="App.toggleColAisle(${c})" title="${isColAisle ? 'Quitar pasillo' : 'Insertar pasillo'}" class="px-2 py-1.5 text-[9px] font-black rounded-lg transition-all shadow-sm ${isColAisle ? 'bg-red-500 text-white hover:bg-red-600 shadow-red-200 ring-2 ring-red-200' : 'bg-white border-2 border-slate-200 text-slate-400 hover:border-indigo-400 hover:text-indigo-500'}">
                                    ${isColAisle ? 'QUITAR' : '+ PASILLO'}
                                </button>
                            </div>
                        `;
                    }
                }

                let created = 0, r = 0, visualRowLabel = 1, visualRowIdx = 0;
                const targetSeats = this.state.students.length - benchedList.length;
                let renderedExtraRows = 0; 
                
                while (true) {
                    if (created >= Math.max(1, targetSeats)) {
                        if (!this.state.editMode) break;
                        if (renderedExtraRows >= 2) break;
                        renderedExtraRows++;
                    }

                    const isRowAisle = this.state.rowAisles && this.state.rowAisles.includes(r);
                    
                    let rowHeader = `<div class="flex items-center justify-center pr-2 font-bold text-slate-400 text-sm select-none my-2 sm:my-3">${isRowAisle ? '' : visualRowLabel}</div>`;
                    if (this.state.editMode) {
                        rowHeader = `
                            <div class="flex items-center justify-center pr-2 my-2 sm:my-3">
                                <button onclick="App.toggleRowAisle(${r})" title="${isRowAisle ? 'Quitar pasillo' : 'Insertar pasillo'}" class="px-2 py-1.5 text-[9px] font-black rounded-lg transition-all shadow-sm ${isRowAisle ? 'bg-red-500 text-white hover:bg-red-600 shadow-red-200 ring-2 ring-red-200' : 'bg-white border-2 border-slate-200 text-slate-400 hover:border-indigo-400 hover:text-indigo-500'}">
                                    ${isRowAisle ? 'QUITAR' : '+ PASILLO'}
                                </button>
                            </div>
                        `;
                    }
                    gridHtml += rowHeader;

                    // Si toda la fila es un pasillo horizontal
                    if (isRowAisle) {
                        gridHtml += `
                            <div style="grid-column: span ${totalGridCols};" class="w-full flex items-center justify-center my-2 sm:my-3">
                                <div class="w-full h-10 sm:h-14 bg-slate-200/40 rounded-lg flex items-center justify-center relative">
                                    <span class="text-slate-400 text-[10px] font-black tracking-widest uppercase">PASILLO HORIZONTAL</span>
                                </div>
                            </div>
                        `;
                        r++;
                        continue; 
                    }

                    // Renderización de cada puesto en la fila
                    let visualColIdx = 0;
                    for (let c = 0; c < totalGridCols; c++) {
                        const isColAisle = this.state.colAisles && this.state.colAisles.includes(c);
                        const sId = `${r}-${c}`;

                        if (isColAisle) {
                            gridHtml += `
                                <div class="w-full h-full flex items-center justify-center">
                                    <div class="w-full bg-slate-200/40 rounded-lg min-h-[80px] sm:min-h-[96px] relative mx-1 my-2 sm:mx-1.5 sm:my-3 flex items-center justify-center">
                                        ${visualRowLabel === 1 ? '<span class="text-slate-400 text-[10px] font-black tracking-widest absolute top-1/2 -translate-y-1/2" style="writing-mode: vertical-rl; transform: rotate(180deg);">PASILLO</span>' : ''}
                                    </div>
                                </div>
                            `;
                            continue;
                        }

                        // Lógica de Agrupación (Márgenes y Redondeos)
                        let deskMargin = 'm-2 sm:m-3';
                        let deskRounding = 'rounded-xl';
                        let topBarRounding = 'rounded-t-lg';
                        const format = this.state.groupFormat || 'individual';
                        
                        if (format === 'pairs') {
                            const pos = visualColIdx % 2;
                            if (pos === 0) { 
                                deskMargin = 'my-2 ml-3 mr-0.5 sm:my-3 sm:ml-4 sm:mr-1'; deskRounding = 'rounded-l-2xl rounded-r-md'; topBarRounding = 'rounded-tl-xl rounded-tr-sm'; 
                            } else { 
                                deskMargin = 'my-2 ml-0.5 mr-3 sm:my-3 sm:ml-1 sm:mr-4'; deskRounding = 'rounded-r-2xl rounded-l-md'; topBarRounding = 'rounded-tr-xl rounded-tl-sm'; 
                            }
                        } else if (format === 'trios') {
                            const pos = visualColIdx % 3;
                            if (pos === 0) { 
                                deskMargin = 'my-2 ml-3 mr-0.5 sm:my-3 sm:ml-4 sm:mr-1'; deskRounding = 'rounded-l-2xl rounded-r-md'; topBarRounding = 'rounded-tl-xl rounded-tr-sm'; 
                            } else if (pos === 1) { 
                                deskMargin = 'my-2 mx-0.5 sm:my-3 sm:mx-1'; deskRounding = 'rounded-md'; topBarRounding = 'rounded-t-sm'; 
                            } else { 
                                deskMargin = 'my-2 ml-0.5 mr-3 sm:my-3 sm:ml-1 sm:mr-4'; deskRounding = 'rounded-r-2xl rounded-l-md'; topBarRounding = 'rounded-tr-xl rounded-tl-sm'; 
                            }
                        } else if (format === 'quads') {
                            const posX = visualColIdx % 2;
                            const posY = visualRowIdx % 2;
                            
                            deskMargin = `${posY === 0 ? 'mt-3 mb-0.5 sm:mt-4 sm:mb-1' : 'mt-0.5 mb-3 sm:mt-1 sm:mb-4'} ${posX === 0 ? 'ml-3 mr-0.5 sm:ml-4 sm:mr-1' : 'ml-0.5 mr-3 sm:ml-1 sm:mr-4'}`;
                            
                            if (posX === 0 && posY === 0) { 
                                deskRounding = 'rounded-tl-2xl rounded-tr-md rounded-bl-md rounded-br-sm'; topBarRounding = 'rounded-tl-xl rounded-tr-sm'; 
                            } else if (posX === 1 && posY === 0) { 
                                deskRounding = 'rounded-tr-2xl rounded-tl-md rounded-br-md rounded-bl-sm'; topBarRounding = 'rounded-tr-xl rounded-tl-sm'; 
                            } else if (posX === 0 && posY === 1) { 
                                deskRounding = 'rounded-bl-2xl rounded-tl-md rounded-br-md rounded-tr-sm'; topBarRounding = 'rounded-tl-md rounded-tr-sm'; 
                            } else if (posX === 1 && posY === 1) { 
                                deskRounding = 'rounded-br-2xl rounded-tr-md rounded-bl-md rounded-tl-sm'; topBarRounding = 'rounded-tr-md rounded-tl-sm'; 
                            }
                        }

                        // Si es un escritorio oculto manualmente (Puesto Nulo)
                        if (this.state.hiddenDesks[sId]) {
                            gridHtml += `
                                <div class="w-full h-full flex items-center justify-center">
                                    <div onclick="App.toggleDeskVisibility('${sId}')" class="w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center transition-all ${deskMargin} ${deskRounding} ${this.state.editMode ? 'bg-slate-200 border-2 border-dashed border-slate-300 cursor-pointer hover:bg-indigo-50 hover:border-indigo-300' : 'opacity-0 pointer-events-none'}">
                                        ${this.state.editMode ? '<span class="text-slate-400 text-[9px] font-bold text-center leading-tight">PUESTO<br>NULO</span>' : ''}
                                    </div>
                                </div>
                            `;
                        } else {
                            // Renderización estándar de escritorio
                            const stuId = this.state.assignments[sId];
                            const s = this.state.students.find(item => item.id === stuId);
                            const isConflict = conflicts.has(sId);
                            const isWarning = warnings.has(sId);
                            const isHighlighted = this.state.searchTerm.trim() !== '' && s && s.name.toLowerCase().includes(this.state.searchTerm.toLowerCase());
                            
                            const bgClass = isHighlighted ? 'bg-blue-50 border-blue-500 ring-4 ring-blue-200 z-10 scale-105 shadow-lg border-2' : `bg-white border-2 shadow-sm ${isConflict ? 'border-red-600 ring-4 ring-red-100' : isWarning ? 'border-amber-500 ring-4 ring-amber-100' : 'border-indigo-200'}`;
                            const topBarClass = isHighlighted ? 'bg-blue-500' : isConflict ? 'bg-red-600' : isWarning ? 'bg-amber-500' : 'bg-indigo-300';
                            const avatarClass = isHighlighted ? 'bg-blue-200 text-blue-800' : isConflict ? 'bg-red-100 text-red-700' : isWarning ? 'bg-amber-100 text-amber-600' : 'bg-indigo-100 text-indigo-700';
                            const nameClass = isHighlighted ? 'text-blue-800' : isConflict ? 'text-red-700' : isWarning ? 'text-amber-600' : 'text-slate-700';

                            let adaptiveTextSize = 'text-[9px] sm:text-[11px]';
                            if (s && s.name.length > 16) adaptiveTextSize = 'text-[7px] sm:text-[8.5px]';
                            else if (s && s.name.length > 11) adaptiveTextSize = 'text-[8px] sm:text-[9.5px]';

                            gridHtml += `
                                <div class="w-full h-full flex items-center justify-center">
                                    <div onclick="App.toggleDeskVisibility('${sId}')" ondragover="event.preventDefault()" ondrop="if(!App.state.editMode) App.handleDropOnSeat(event, '${sId}')" class="group w-20 h-20 sm:w-24 sm:h-24 transition-all relative flex flex-col items-center justify-center p-2 text-center select-none ${deskMargin} ${deskRounding} ${this.state.editMode ? 'cursor-pointer hover:ring-2 hover:ring-red-400 bg-white border-2 border-indigo-200 shadow-sm' : bgClass}">

                                <div class="flex-1">
                                    <label class="text-xs font-bold text-slate-500 uppercase mb-2 flex items-center gap-2"><i data-lucide="calendar-days" class="w-4 h-4"></i> Fecha</label>
                                    <input type="date" id="classDateInput" value="${this.state.classDate}" onchange="App.setClassDate(this.value)" class="w-full border-2 border-slate-200 rounded-xl px-4 py-2 focus:border-indigo-500 outline-none text-sm font-medium transition-colors text-slate-700" />
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50/50 border-b border-slate-200">
                                        <tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest">
                                            <th class="p-6">Estudiante</th>
                                            <th class="p-6">Configuración</th>
                                            <th class="p-6 text-right">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${this.state.students.map(s => `
                                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors group">
                                                <td class="p-6 font-bold text-slate-700 flex items-center gap-4">
                                                    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-black text-sm shrink-0">${s.name.charAt(0).toUpperCase()}</div>
                                                    <span class="truncate">${s.name}</span>
                                                    <button onclick="App.openEditNameModal('${s.id}')" class="text-slate-400 sm:text-slate-300 hover:text-indigo-600 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-all p-1.5 rounded-lg hover:bg-indigo-50 shrink-0" title="Editar nombre">
                                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                                    </button>
                                                </td>
                                                <td class="p-6">
                                                    <div class="flex gap-2">
                                                        <button onclick="App.openRestrictionModal('${s.id}')" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold border-2 transition-all ${(Array.isArray(s.restrictions) ? s.restrictions.length : Object.keys(s.restrictions || {}).length) > 0 ? 'bg-red-50 border-red-200 text-red-600' : 'bg-slate-50 border-slate-100 text-slate-400'}">
                                                            <i data-lucide="user-x" class="w-3.5 h-3.5"></i> ${Array.isArray(s.restrictions) ? s.restrictions.length : Object.keys(s.restrictions || {}).length} Restr.
                                                        </button>
                                                        <button onclick="App.openLimitModal('${s.id}')" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold border-2 transition-all ${s.maxRow ? 'bg-amber-50 border-amber-200 text-amber-600' : 'bg-slate-50 border-slate-100 text-slate-400'}">
                                                            <i data-lucide="arrow-down-to-line" class="w-3.5 h-3.5"></i> ${s.maxRow ? `Hasta Fila ${s.maxRow}` : 'Sin Límite'}
                                                        </button>
                                                    </div>
                                                </td>
                                                <td class="p-6 text-right">
                                                    <button onclick="App.handleRemoveStudent('${s.id}')" class="text-slate-300 hover:text-red-500 p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                        <tr class="bg-slate-50/30">
                                            <td colspan="3" class="p-4">
                                                <form onsubmit="App.handleAddStudent(event)" class="flex gap-2 max-w-md ml-2">
                                                    <input type="text" id="newStudentName" placeholder="Nuevo estudiante..." class="flex-1 bg-white border-2 border-slate-200 rounded-xl px-4 py-2 focus:border-indigo-500 outline-none text-sm font-medium" />
                                                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-indigo-700 transition-all"><i data-lucide="check" class="w-5 h-5"></i></button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        // Exportar a global para que funcionen los onclicks
        window.App = App;

        // Iniciar la aplicación cuando cargue el DOM
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
